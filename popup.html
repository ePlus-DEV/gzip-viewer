<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GZIP JSONL Viewer</title>
  <style>
    body { width: 360px; margin: 0; padding: 16px; box-sizing: border-box; font-family: system-ui, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    input { display: block; width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #999; border-radius: 8px; }
    button { width: 100%; margin-top: 10px; padding: 10px; border: none; border-radius: 8px; background: #1769d2; color: white; cursor: pointer; }
    #error { font-size: 12px; color: #cc3939; }
    .help { color: #777; font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>GZIP JSONL Viewer</h1>
  <form id="openForm">
    <input id="url" type="url" placeholder="https://example.com/feeds/products.jsonl.gz" required>
    <button type="submit">Open &amp; View</button>
  </form>
  <p id="error" role="alert"></p>
  <p class="help">View a remote .jsonl.gz file in Chrome. No file is saved to Downloads.</p>
  <script src="popup.js"></script>
</body>
</html>
