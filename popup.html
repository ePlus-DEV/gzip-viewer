<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GZIP JSONL Viewer</title>
  <style>
    body{width:380px;margin:0;padding:16px;box-sizing:border-box;font-family:system-ui,sans-serif}
    h1{font-size:18px;margin:0 0 12px}
    input{display:block;width:100%;box-sizing:border-box;padding:10px;border:1px solid #999;border-radius:8px}
    button{width:100%;margin-top:10px;padding:10px;border:none;border-radius:8px;background:#1769d2;color:#fff;cursor:pointer;font-weight:600}
    .secondary{background:#444}
    #error{font-size:12px;color:#cc3939}
    .help{color:#777;font-size:12px;line-height:1.5}
  </style>
</head>
<body>
  <h1>GZIP JSONL Viewer</h1>
  <form id="openForm">
    <input id="url" type="url" placeholder="https://example.com/feeds/products.json" required>
    <button type="submit">Open &amp; Validate</button>
  </form>
  <button id="lastFeed" class="secondary" type="button">Open last URL</button>
  <p id="error" role="alert"></p>
  <p class="help">Supports feed index JSON, single-product JSON, plain JSONL and GZIP JSONL. Remote data is fetched and inspected in Chrome without creating a file in Downloads.</p>
  <script src="popup.js"></script>
</body>
</html>
