<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GZIP JSONL Viewer</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <div class="header-title"><strong>GZIP JSONL Viewer</strong><span id="mode"></span></div>
    <div class="controls">
      <input id="search" type="search" placeholder="Search records / shards" aria-label="Search records">
      <select id="limit" aria-label="Display limit">
        <option value="100">100 results</option>
        <option value="500" selected>500 results</option>
        <option value="1000">1,000 results</option>
        <option value="5000">5,000 results</option>
        <option value="0">All results</option>
      </select>
      <button id="reload">Reload</button>
    </div>
  </header>
  <div id="source"></div>
  <div id="status" role="status" aria-live="polite">Loading…</div>
  <section id="summary" aria-label="Feed summary"></section>
  <main id="items"></main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
